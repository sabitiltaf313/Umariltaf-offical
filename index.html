<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عمر الطاف اسٹور</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f2f2f2}
.container{max-width:500px;margin:auto;padding:15px}
.card{background:#fff;padding:20px;border-radius:18px;margin-top:20px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
input,select{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:12px;font-size:15px}
.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;font-size:16px;margin-top:10px;cursor:pointer}
.tabs{display:flex;background:#eee;border-radius:12px;padding:4px;margin:15px 0}
.tabs button{flex:1;padding:11px;border:none;border-radius:10px;cursor:pointer}
.tabs button.active{background:#000;color:#fff}
</style>
</head>
<body>
<div class="container">
<div class="card" style="text-align:center">
<h2>عمر الطاف آفیشل اسٹور</h2>
<p style="color:gray">قیمت 1600 | سیلر 1400 + اسٹور 200</p>

<div class="tabs">
<button id="t1" class="active" onclick="showTab('login')">لاگ ان</button>
<button id="t2" onclick="showTab('signup')">سائن اپ</button>
</div>

<div id="loginBox">
<input id="l_id" placeholder="ای میل / فون / کوڈ">
<input id="l_pass" type="password" placeholder="پاس ورڈ">
<button class="btn" onclick="loginNow()">لاگ ان کریں</button>
</div>

<div id="signupBox" style="display:none">
<input id="s_name" placeholder="پورا نام *">
<input id="s_phone" placeholder="فون نمبر *">
<input id="s_email" placeholder="ای میل *">
<input id="s_pass" type="password" placeholder="پاس ورڈ *">
<select id="s_role"><option value="customer">کسٹمر</option><option value="affiliate">ایفلی ایٹ</option></select>
<button class="btn" style="background:#25D366" onclick="signupNow()">اکاؤنٹ بنائیں</button>
</div>

<p id="msg" style="color:green;font-weight:bold;margin-top:12px"></p>

<div style="margin-top:20px;text-align:right;font-size:12px;color:gray">
ایڈمن: admin / 12345 (صرف آپ کے لیے)
</div>

</div>
</div>

<script>
function showTab(t){
 document.getElementById('loginBox').style.display = t==='login'?'block':'none';
 document.getElementById('signupBox').style.display = t==='signup'?'block':'none';
 document.getElementById('t1').classList.toggle('active', t==='login');
 document.getElementById('t2').classList.toggle('active', t==='signup');
}

function signupNow(){
 let name = document.getElementById('s_name').value.trim();
 let phone = document.getElementById('s_phone').value.trim();
 let email = document.getElementById('s_email').value.trim();
 let pass = document.getElementById('s_pass').value.trim();
 let role = document.getElementById('s_role').value;
 
 if(!name || !phone || !email || !pass){
   alert('براہ کرم تمام خانے پُر کریں');
   return;
 }
 
 let users = JSON.parse(localStorage.getItem('users') || '[]');
 if(users.find(u=>u.email===email)){
   alert('یہ ای میل پہلے سے موجود ہے');
   return;
 }
 
 let code = 'AFF' + Math.floor(Math.random()*9000+1000);
 users.push({name, phone, email, pass, role, code});
 localStorage.setItem('users', JSON.stringify(users));
 
 document.getElementById('msg').innerText = 'مبارک ہو! اکاؤنٹ بن گیا۔ کوڈ: ' + code + ' اب لاگ ان کریں';
 showTab('login');
 document.getElementById('l_id').value = email;
}

function loginNow(){
 let id = document.getElementById('l_id').value.trim();
 let pass = document.getElementById('l_pass').value.trim();
 
 if(id.toLowerCase() === 'admin' && pass === '12345'){
   document.getElementById('msg').innerText = 'ایڈمن لاگ ان کامیاب! ایڈمن پینل کھل رہا ہے...';
   localStorage.setItem('isAdmin','true');
   setTimeout(()=>{ window.location.href = window.location.pathname + '?admin=true'; }, 500);
   return;
 }
 
 let users = JSON.parse(localStorage.getItem('users') || '[]');
 let found = users.find(u => (u.email===id || u.phone===id || u.code===id) && u.pass===pass);
 
 if(found){
   document.getElementById('msg').innerText = 'خوش آمدید ' + found.name;
   localStorage.setItem('currentUser', JSON.stringify(found));
 } else {
   alert('ای میل یا پاس ورڈ غلط ہے');
 }
}
</script>
</body>
</html>
